name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check:levels
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  pages:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check initial Pages setting
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/pages.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/pages")
          if [ "$status" = 200 ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" = 404 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Initial setup needed: Settings > Pages > Source > GitHub Actions. Then re-run this workflow.'
            echo '### Pages is not enabled yet' >> "$GITHUB_STEP_SUMMARY"
            echo 'Open Settings → Pages → Source → GitHub Actions, then re-run this workflow. Tests passed; publication has not happened.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Cannot check Pages setting (HTTP $status)."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.ready.outputs.enabled == 'true'
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
        if: steps.ready.outputs.enabled == 'true'
